<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="AETHER at a glance: 93.6 MB cold-start memory, 7.0 MB bundle, no telemetry, four panes, synchronized scrolling, an automation socket and keyboard-first navigation">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D94E8"/>
      <stop offset="1" stop-color="#67C6F5"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="540" rx="28" fill="#F6F8FB"/>

  <!-- Row 1 -->
  <g>
    <!-- A: cold-start memory -->
    <rect x="24" y="24" width="567" height="250" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="52" y="98" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1" fill="#0F172A">93.6 MB</text>
    <rect x="52" y="112" width="40" height="5" rx="2.5" fill="url(#ocean)"/>
    <text x="52" y="142" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F172A">cold-start memory, main process</text>

    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5">
      <text x="52" y="181" fill="#334155" font-weight="600">AETHER</text>
      <rect x="124" y="170" width="390" height="13" rx="6.5" fill="#EDF1F7"/>
      <rect x="124" y="170" width="43" height="13" rx="6.5" fill="url(#ocean)"/>
      <text x="177" y="181" fill="#475569">93.6 MB</text>

      <text x="52" y="211" fill="#64748B">Chrome</text>
      <rect x="124" y="200" width="390" height="13" rx="6.5" fill="#EDF1F7"/>
      <rect x="124" y="200" width="207" height="13" rx="6.5" fill="#B6C2D1"/>
      <text x="341" y="211" fill="#475569">~450 MB</text>

      <text x="52" y="241" fill="#64748B">Arc</text>
      <rect x="124" y="230" width="390" height="13" rx="6.5" fill="#EDF1F7"/>
      <rect x="124" y="230" width="390" height="13" rx="6.5" fill="#D7DEE8"/>
      <text x="524" y="241" fill="#475569">~850 MB</text>
    </g>
    <text x="52" y="263" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">measured on Apple Silicon</text>

    <!-- B: bundle -->
    <rect x="609" y="24" width="274.5" height="250" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="637" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1" fill="#0F172A">7.0 MB</text>
    <rect x="637" y="120" width="40" height="5" rx="2.5" fill="url(#ocean)"/>
    <text x="637" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">the entire app bundle</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">
      <text x="637" y="184">One signed executable —</text>
      <text x="637" y="202">no Chromium, no Electron,</text>
      <text x="637" y="220">no bundled runtime.</text>
    </g>

    <!-- C: telemetry -->
    <rect x="901.5" y="24" width="274.5" height="250" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="929.5" y="106" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0F172A">0</text>
    <rect x="929.5" y="120" width="40" height="5" rx="2.5" fill="url(#ocean)"/>
    <text x="929.5" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">telemetry pings</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">
      <text x="929.5" y="184">No analytics daemon, no</text>
      <text x="929.5" y="202">crash beacons, no account,</text>
      <text x="929.5" y="220">no cloud sign-in.</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g>
    <!-- D: panes -->
    <rect x="24" y="292" width="274.5" height="224" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="52" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0F172A">4</text>
    <rect x="52" y="384" width="40" height="5" rx="2.5" fill="url(#purple)"/>
    <text x="52" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">panes in one window</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">
      <text x="52" y="446">Two, three or four pages</text>
      <text x="52" y="464">tiled with ⌥⌘2 · ⌥⌘3 · ⌥⌘4 —</text>
      <text x="52" y="482">drop a tab on a corner.</text>
    </g>

    <!-- E: synchronized scrolling -->
    <rect x="316.5" y="292" width="274.5" height="224" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="344.5" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">⌥⌘S</text>
    <rect x="344.5" y="384" width="40" height="5" rx="2.5" fill="url(#purple)"/>
    <text x="344.5" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">synchronized scrolling</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">
      <text x="344.5" y="446">Two panes share one scroll</text>
      <text x="344.5" y="464">position, for diffs and</text>
      <text x="344.5" y="482">side-by-side reading.</text>
    </g>

    <!-- F: automation socket -->
    <rect x="609" y="292" width="274.5" height="224" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="637" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">MCP</text>
    <rect x="637" y="384" width="40" height="5" rx="2.5" fill="url(#purple)"/>
    <text x="637" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">automation socket</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">
      <text x="637" y="446">Local agents and scripts</text>
      <text x="637" y="464">drive tabs and read pages</text>
      <text x="637" y="482">over JSON-RPC.</text>
    </g>

    <!-- G: keyboard -->
    <rect x="901.5" y="292" width="274.5" height="224" rx="20" fill="#FFFFFF" stroke="#E6EBF2" stroke-width="1.5"/>
    <text x="929.5" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#0F172A">⌘K</text>
    <rect x="929.5" y="384" width="40" height="5" rx="2.5" fill="url(#purple)"/>
    <text x="929.5" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0F172A">keyboard first</text>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" fill="#64748B">
      <text x="929.5" y="446">Omnibox, tabs, splits and</text>
      <text x="929.5" y="464">reader without leaving</text>
      <text x="929.5" y="482">the keys.</text>
    </g>
  </g>
</svg>
